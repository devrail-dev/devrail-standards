# Weekly dependency updates for the manifests maintained in this repository.
# Add an entry when introducing a new package ecosystem or manifest directory.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/dev-toolchain"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/devrail.dev"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/pre-commit-conventional-commits"
    schedule:
      interval: "weekly"
